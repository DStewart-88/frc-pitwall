[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pitwall"
version = "0.1.0"
description = "FRC robot logs in, team-readable reports out"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
pitwall = "pitwall.cli:main"

[tool.setuptools.packages.find]
include = ["pitwall*"]

[tool.setuptools.package-data]
"pitwall.report" = ["fonts/*.woff2", "fonts/*.txt"]
