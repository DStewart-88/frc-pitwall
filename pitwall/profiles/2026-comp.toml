# Pitwall robot profile: Team 88's 2026 competition robot.
# Written from the BaseComp code (BOB build 0d4e0b9). Each key field may list several keys;
# the first one present in a log is used. The second key in a list is the name the
# AdvantageKit IO-layer rewrite will log, so this profile keeps working after that change.

[robot]
name = "2026 Comp"
project = "2026-Robot"
battery_voltage = "/SystemStats/BatteryVoltage"
enabled = "/DriverStation/Enabled"
autonomous = "/DriverStation/Autonomous"
brownout = "/SystemStats/BrownedOut"

[game]
auto_s = 20
teleop_s = 140
alliance_key = "/DriverStation/AllianceStation"        # 1-3 red, 4-6 blue
game_data_key = "/DriverStation/GameSpecificMessage"   # alliance whose hub goes inactive first

# REBUILT match periods, by match time left (s). Teleop: Transition 2:20-2:10, Alliance
# Shifts 1-4 of 25 s each, End Game 0:30-0:00. The alliance named in the game data has its
# hub inactive in Shifts 1 and 3 and active in Shifts 2 and 4; the other alliance the reverse.
[[period]]
name = "Auto"
from_left = 160
to_left = 140

[[period]]
name = "Transition"
from_left = 140
to_left = 130

[[period]]
name = "Shift 1"
from_left = 130
to_left = 105
hub = "inactive_if_named"

[[period]]
name = "Shift 2"
from_left = 105
to_left = 80
hub = "active_if_named"

[[period]]
name = "Shift 3"
from_left = 80
to_left = 55
hub = "inactive_if_named"

[[period]]
name = "Shift 4"
from_left = 55
to_left = 30
hub = "active_if_named"

[[period]]
name = "End Game"
from_left = 30
to_left = 0

[settings]
grid_ms = 20
active_amps = 2.0      # a motor counts as active above this supply current
saturation = 0.97      # applied volts / battery volts at or above this counts as full output
current_mode = "signed"

# Robot states, highest priority first. Ticks where none is on are "Other" (shown as "Still").
[[state]]
name = "Shooting"
priority = 1
when = "/RealOutputs/RobotContainer/IsShooting"

[[state]]
name = "Driving"
priority = 2
any_above = [
  "/Drive/Module0/DriveVelocityRadPerSec", "/Drive/Module1/DriveVelocityRadPerSec",
  "/Drive/Module2/DriveVelocityRadPerSec", "/Drive/Module3/DriveVelocityRadPerSec",
]
threshold = 3.0        # wheel rad/s, about 0.15 m/s on a 4 in wheel

# Subsystems as the team reports them. `color` is a fixed palette slot.
[[subsystem]]
id = "drive"
name = "Drive"
color = 0

[[subsystem]]
id = "steer"
name = "Steer"
color = 1

[[subsystem]]
id = "shooter"
name = "Shooter"
color = 2
needed_in = ["Shooting"]

[[subsystem]]
id = "feeder"
name = "Feeder"
color = 3
needed_in = ["Shooting"]

[[subsystem]]
id = "floor"
name = "Floor, roof, funnel"
color = 4
needed_in = ["Shooting"]

[[subsystem]]
id = "intake"
name = "Intake rollers"
color = 5

[[subsystem]]
id = "aim"
name = "Turret, hood, pivot"
color = 6

